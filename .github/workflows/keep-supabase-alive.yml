name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta cada 3 días a las 12:00 UTC
    # Supabase pausa proyectos inactivos tras 7 días, esto lo previene
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping-supabase:
    name: Ping Supabase Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase Auth Health
        run: |
          echo "🏓 Haciendo ping a Supabase..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://uvjpcegnynajhrxrwpxz.supabase.co/auth/v1/health" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2anBjZWdueW5hamhyeHJ3cHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NzY1MzMsImV4cCI6MjEwMzU1MjUzM30.XMsle-p3BUlxLXLqgL34sZeN5tzTGtH2tNtQcCkTvaQ")

          echo "📡 Código de respuesta: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Supabase está activo y respondiendo correctamente."
          else
            echo "⚠️ Supabase respondió con código: $STATUS"
            exit 1
          fi

      - name: Ping Supabase REST API
        run: |
          echo "🏓 Verificando REST API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://uvjpcegnynajhrxrwpxz.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2anBjZWdueW5hamhyeHJ3cHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NzY1MzMsImV4cCI6MjEwMzU1MjUzM30.XMsle-p3BUlxLXLqgL34sZeN5tzTGtH2tNtQcCkTvaQ" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV2anBjZWdueW5hamhyeHJ3cHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NzY1MzMsImV4cCI6MjEwMzU1MjUzM30.XMsle-p3BUlxLXLqgL34sZeN5tzTGtH2tNtQcCkTvaQ")

          echo "📡 Código de respuesta REST: $STATUS"
          echo "✅ Ping completado. Proyecto Supabase mantenido activo."
